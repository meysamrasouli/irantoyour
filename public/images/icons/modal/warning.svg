<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="SVGAlertkMark" viewBox="-240 331.8 130.2 130.2">
    <style>
        .svg-exclamation-line, .svg-exclamation-circle, .svg-exclamation-outline{
            stroke-dasharray: 1000;
            stroke-dashoffset: 0;
            stroke: #f39c12;
            stroke-width: 6;
            fill: none;
        }
        .svg-exclamation-line {
            stroke-linecap: round;
            stroke-dashoffset: 1000;
            animation: dash .9s .35s ease-in-out forwards;
        }
        .svg-exclamation-circle{
            stroke-dashoffset: -100;
            animation: scale .3s ease-in-out .4s both;
        }
        .svg-exclamation-outline{
            animation: dash .9s ease-in-out;
        }
        @keyframes dash {/*moving from start to End*/
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes scale {
            0% { transform: none; }
            100% { fill:#f39c12; transform: scale(1, 1, 1); }
        }
    </style>
    <path class="svg-exclamation-line" d="M-175.7,370.9v35.2"/>
    <circle class="svg-exclamation-circle" cx="-175.5" cy="427.8" r="4"/>
    <path class="svg-exclamation-outline" d="M-175.1,449.8h47.7c5,0,9.6-2.6,12.1-7c2.5-4.3,2.5-9.6,0-14l-47.7-82.6c-2.5-4.3-7.1-7-12.1-7c-4.9,0-9.6,2.6-12.1,7l-47.7,82.6c-2.5,4.3-2.5,9.6,0,14c2.5,4.3,7.1,7,12.1,7H-175.1"/>
</svg>
